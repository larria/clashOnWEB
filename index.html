<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>皇室战争 单机版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { touch-action:manipulation; }
  body {
    background:#1a1a2e; color:#eee; font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:8px;
    overflow:auto;
  }
  #wrap { align-self:flex-start; }
  h1 { font-size:20px; margin-bottom:8px; color:#ffd700; }
  #wrap { display:flex; gap:12px; align-items:flex-start; justify-content:center; }
  #gameCol { display:flex; flex-direction:column; align-items:center; min-width:0; }
  #handArea { width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:6px; }
  #side {
    width:220px; max-width:220px; display:flex; flex-direction:column; gap:10px; font-size:13px; flex-shrink:0;
  }
  /* ===== 手牌卡(CSS 变量控制尺寸,由 fitHandCards 动态设置)===== */
  :root { --card-w:80px; --card-h:100px; --card-font:11px; --orb-size:30px; }
  .handCard {
    width:var(--card-w); height:var(--card-h);
    border-radius:6px; padding:4px; position:relative; text-align:center;
    font-size:var(--card-font); display:flex; flex-direction:column; justify-content:space-between;
    flex-shrink:0; user-select:none; -webkit-user-select:none;
  }
  .nextCard {
    width:calc(var(--card-w) * 0.75); height:var(--card-h);
    background:#1a1a2e; border:2px dashed #555; border-radius:6px; padding:4px;
    text-align:center; font-size:calc(var(--card-font) - 1px);
    display:flex; flex-direction:column; justify-content:center; opacity:0.7; flex-shrink:0;
  }
  .cardOrb {
    width:var(--orb-size); height:var(--orb-size); border-radius:50%; margin:0 auto; flex-shrink:0;
  }

  /* ===== 移动端:纵向堆叠布局 ===== */
  @media (max-width: 860px) {
    body { padding:4px; }
    h1 { font-size:16px; margin-bottom:4px; }
    #wrap { flex-direction:column; align-items:stretch; gap:8px; width:100%; }
    #gameCol { width:100%; align-items:center; }
    #side { width:100%; max-width:100%; flex-direction:row; flex-wrap:wrap; gap:6px; }
    #side .panel { flex:1 1 45%; min-width:140px; font-size:12px; }
    #side .panel:last-child { flex:1 1 100%; }
    #log { height:120px; }
    #canvasWrap { border-width:2px; }
  }
  #canvasWrap {
    position:relative;
    background:#000;
    border:3px solid #444;
    border-radius:8px;
    overflow:hidden;
  }
  canvas { display:block; }
  #status {
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.6); padding:4px 12px; border-radius:12px; font-size:13px;
    pointer-events:none;
  }
  #result {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.85); padding:24px 40px; border-radius:12px;
    text-align:center; display:none; z-index:10;
  }
  #result h2 { font-size:32px; margin-bottom:12px; }
  .panel { background:#2a2a4e; padding:10px; border-radius:6px; }
  .panel h3 { font-size:14px; margin-bottom:6px; color:#ffd700; }
  #log { height:280px; overflow-y:auto; font-size:11px; line-height:1.6; font-family:monospace; }
  #log div { padding:1px 2px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .me { color:#7fd; }
  .ai { color:#f87; }
  .sys { color:#ffd700; font-weight:bold; }
  .kill { color:#f55; }
  .spell { color:#c9f; }
  .btn {
    background:#3a7d3a; color:#fff; border:none; padding:8px 14px; border-radius:4px;
    cursor:pointer; font-size:13px;
  }
  .btn:hover { background:#4a8d4a; }
  .btn-blue { background:#3a5d8a; }
  .btn-blue:hover { background:#4a6d9a; }
  select { background:#1a1a2e; color:#eee; border:1px solid #555; padding:4px; border-radius:3px; width:100%; }
  label { display:block; margin:6px 0 2px; font-size:12px; color:#aaa; }
</style>
</head>
<body>
<h1>⚔️ 皇室战争 单机版</h1>
<div id="wrap">
  <div id="gameCol">
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="status"></div>
    </div>
    <div id="handArea"></div>
  </div>
  <div id="side">
    <div class="panel">
      <h3>📜 战斗信息</h3>
      <div id="info"></div>
    </div>
    <div class="panel">
      <h3>⚙️ 设置</h3>
      <label>玩家卡组(同卡组对战)</label>
      <select id="deckSelect">
        <option value="strong">强卡组(巨人体系)</option>
        <option value="hog">野猪快攻</option>
        <option value="golem">戈仑重击</option>
        <option value="air">空军流</option>
        <option value="cycle">速转流</option>
      </select>
      <label>AI 强度</label>
      <select id="aiLevel">
        <option value="1">普通</option>
        <option value="1.3" selected>困难</option>
        <option value="1.6">挑战</option>
      </select>
      <div style="margin-top:8px"><button class="btn btn-blue" id="restart">重新开始</button></div>
    </div>
    <div class="panel">
      <h3>📝 操作日志</h3>
      <div id="log"></div>
    </div>
    <div class="panel" style="font-size:11px;line-height:1.6">
      <h3>❓ 玩法</h3>
      点击下方手牌选中,再点击己方半场(河道下方)部署。法术可全场释放。摧毁对方国王塔获胜。
    </div>
  </div>
</div>
<div id="result"><h2 id="resultText"></h2><button class="btn" onclick="location.reload()">再来一局</button></div>

<script src="js/constants.js"></script>
<script src="js/cards.js"></script>
<script src="js/unit.js"></script>
<script src="js/tower.js"></script>
<script src="js/combat.js"></script>
<script src="js/spells.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
