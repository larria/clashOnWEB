<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>皇室战争 单机版</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push(e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno);});</script>
<div id="wrap">
  <div id="gameCol">
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="status"></div>
      <!-- 常驻 HUD:倒计时(战场顶部中央空地,不遮挡公主塔) -->
      <div id="hud">
        <div id="hudTimer">03:00</div>
        <div id="hudPhase">常规时间</div>
      </div>
      <!-- 中央大提示(双倍圣水/终场等) -->
      <div id="bigAnnounce"></div>
      <!-- 开始/暂停覆盖层(皇室战争 logo 仅在此出现;未来游戏封面) -->
      <div id="overlay">
        <div class="ovLogo">
          <span class="ovShield">⚔️</span>
          <div class="ovLogoText">
            <div class="ovLogoTitle">皇室战争</div>
            <div class="ovLogoSub">SINGLE PLAYER EDITION</div>
          </div>
        </div>
        <!-- 覆盖层右上角:设置入口(音乐音效等开关) -->
        <div class="ovCornerBtns">
          <button class="ovIconBtn" id="openSettings" title="设置">⚙</button>
        </div>
        <div class="ovInner">
          <div class="ovTitle" id="ovTitle">准备战斗</div>
          <div class="ovDesc" id="ovDesc">选择卡组与 AI 强度后开始</div>
          <button class="btn" id="ovBtn">开始战斗</button>
          <div class="ovHint" id="ovHint">空格键 暂停/继续</div>
        </div>
      </div>
    </div>
    <div id="handArea"></div>
  </div>
  <div id="side">
    <div class="panel">
      <h3>📜 战斗信息</h3>
      <div id="info"></div>
    </div>
    <div class="panel">
      <h3>⚙️ 设置</h3>
      <label>玩家卡组</label>
      <select id="deckSelect"></select>
      <label>AI 强度</label>
      <select id="aiLevel">
        <option value="1">普通</option>
        <option value="1.3" selected>困难</option>
        <option value="1.6">挑战</option>
      </select>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn btn-blue" id="restart" style="flex:1;">重新开始</button>
        <button class="btn btn-blue" id="pauseBtn" style="flex:1;">⏸ 暂停</button>
      </div>
      <div style="margin-top:6px;">
        <button class="btn btn-blue" id="openDeckEditor" style="width:100%;">🃏 编辑卡组</button>
      </div>
    </div>
    <div class="panel">
      <h3>📝 操作日志</h3>
      <div id="log"></div>
    </div>
    <div class="panel" style="font-size:11px;line-height:1.6">
      <h3>❓ 玩法</h3>
      点击下方手牌选中,再点击己方半场(河道下方)部署。法术可全场释放。摧毁对方国王塔获胜。
    </div>
  </div>
</div>
<div id="result">
  <h2 id="resultText"></h2>
  <div id="resultSub" style="font-size:12px;letter-spacing:4px;margin:-10px 0 18px;opacity:0.8;"></div>
  <button class="btn" id="againBtn">再来一局</button>
</div>

<!-- 卡组编辑器 -->
<div id="deckEditor">
  <div id="deckEditorBox">
    <div class="deTitle">🃏 卡组编辑器</div>
    <div class="deSub">10 个卡组槽(1-5 预填经典,6-10 空白待编)· 点击卡牌加入/移除 · 8 张成组 · 自动保存</div>
    <div id="deSlots"></div>
    <div class="deCurLabel" id="deCurLabel"></div>
    <div id="deDeckRow"></div>
    <div class="deSub" style="margin-bottom:6px;">全部卡牌(42 张)· 灰色表示已在卡组中</div>
    <div class="deCardGrid" id="deCardGrid"></div>
    <div class="deFooter">
      <div class="deAvg" id="deAvg"></div>
      <button class="btn btn-blue btn-sm" id="deClear">清空</button>
      <button class="btn btn-blue btn-sm" id="deReset">恢复默认</button>
      <button class="btn btn-sm" id="deDone">完成</button>
    </div>
  </div>
</div>

<!-- 设置页(独立界面,入口在开始遮罩右上角) -->
<div id="settingsScreen">
  <div id="settingsBox">
    <div class="deTitle">⚙ 设置</div>
    <div class="deSub">音乐音效等偏好,自动保存到本机</div>
    <div id="settingsList"></div>
    <div class="settingsFooter">
      <button class="btn btn-sm" id="settingsClose">完成</button>
    </div>
  </div>
</div>

<!-- 应用入口(ES Modules,无构建) -->
<script type="module" src="src/main.js"></script>
</body>
</html>
